services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: debales-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
    volumes:
      - debales-sql-data:/var/opt/mssql
    networks:
      - debales-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"${SA_PASSWORD}\" -Q \"SELECT 1\" -No -l 5 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: debales-api
    ports:
      - "${API_PORT:-5001}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=DebalesDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true"
      Jwt__Secret: "${JWT_SECRET}"
      Jwt__Issuer: "Debales"
      Jwt__Audience: "Debales"
      Jwt__ExpirationHours: "8"
      AI__Provider: "${AI_PROVIDER:-Mock}"
      AI__ApiKey: "${AI_APIKEY:-}"
      AI__Model: "${AI_MODEL:-claude-sonnet-4-6}"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - debales-net
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: debales-web
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=DebalesDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true"
      Jwt__Secret: "${JWT_SECRET}"
      Jwt__Issuer: "Debales"
      Jwt__Audience: "Debales"
      Jwt__ExpirationHours: "8"
      AI__Provider: "${AI_PROVIDER:-Mock}"
      AI__ApiKey: "${AI_APIKEY:-}"
      AI__Model: "${AI_MODEL:-claude-sonnet-4-6}"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - debales-net
    restart: unless-stopped

volumes:
  debales-sql-data:

networks:
  debales-net:
    driver: bridge
